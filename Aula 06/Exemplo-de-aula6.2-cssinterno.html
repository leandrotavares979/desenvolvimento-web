<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Classes no CSS</title>

    <style>
        .titulo{
            color: chocolate;
            text-align: center;
        }
        .caixa01{
            background-color: blanchedalmond;
            border: 2px solid rgb(221, 226, 151);
            padding: 20px;
            margin: 20px;
        }
         .caixa02{
            background-color: rgb(161, 126, 73);
            border: 2px solid rgb(178, 185, 110);
            padding: 20px;
            margin: 20px;
        }
        .paragrafo1{
            color: rebeccapurple;
            font-weight: bold;
        }
        .paragrafo2{
            color: blueviolet;
            background-color: palevioletred ;
            font-style: oblique;
            padding: 10px;
        }

    </style>
</head>
<body>

    <h1 class="titulo">
        Aprendendo sobre Classes no CSS
    </h1>

    <div class="caixa01">
        
        <p class="paragrafo1">Este é o primeiro parágrafo da primeira div. Ele usa uma classe comum para textos.</p>
        <p class="paragrafo2">Este é o segundo parágrafo da primeira div. Ele usa uma classe para destacar informações.</p>

    </div>

    <div class="caixa02">
        
        <p>Este é o único parágrafo da segunda div.
        </p>

    </div>

</body>
</html>
