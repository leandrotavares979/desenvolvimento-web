<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>

    <style>
        .destaque{color: rgb(187, 129, 5);
            font-size: 30px;
            font-weight: bold;
        }

    </style>
    <script>
        alert("O JavaScript do cabeçalho foi executado!");
    </script>
</head>
<body>
    <h1>JavaScript incorporado</h1>

    <p>Este conteúdo foi escrito diretamente no HTML</p>

    <script>
        document.write('<p class="destaque" >Este conteúdo foi criando pelo JavaScript </p>');
    </script>

</body>
</html>
