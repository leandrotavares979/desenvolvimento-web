<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário do Estudante</title>
</head>
<body>
    <h1>Cadastro do Estudante</h1>

    <form>
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Insira seu Nome" required />
        </p>
        <p>
            <label for="email">email</label>
            <input type="email" id="nome" name="email" placeholder="Insira seu email"  required/>
        </p>
        
        <p>
            <label for="senha">Senha:</label>
            <input type="password" id="nome" name="senha" placeholder="insira a senha" required/>
        </p>

        <button type="submit">Enviar</button>

        <button type="reset">Limpar</button>
    </form>
</body>
</html>
