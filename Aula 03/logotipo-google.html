<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logotipo</title>
</head>
<body>
    <h1>Exemplo do Logotipo com foto</h1>

    <figure
        style =
        "
        text-align:center;
        margin:0;
        font-family: Arial, sans-serif;
        transform: translateY(-20px);
        "
    >
        <img
        src="https://commons.wikimedia.org/wiki/File:Front-end-logo-color@2x.png"
        alt="Logotipo com o texto Front-End"
        width="280"
        style="
        border:3px solid rgb(17, 17, 90);
        border-radius: 12px;
        padding: 8px;
        "
        />

        <figcaption>
            Desenvolvimento Front-End para WEB
        </figcaption>


    </figure>

</body>
</html>
