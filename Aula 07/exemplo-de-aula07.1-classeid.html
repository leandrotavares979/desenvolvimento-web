<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Classe e Id</title>

    <link rel="stylesheet" href="style01.css">
</head>
<body>
    <h1>Exemplo de Classe e Id</h1>
    
    <p>Parágrafo comum da página.</p>

    <div>Está é uma div sem formatação</div>

    <br>

    <div class="caixa" Id="aviso">
        Esta div utiliza a classica caixa e o identificador aviso.
    </div>

    <br>

    <span>
        Este é um span sem formatação.
    </span>

    <br><br><br>

    <span class="caixa">
        Este é um span utilizando a classica caixa.
    </span>


</body>
</html>
