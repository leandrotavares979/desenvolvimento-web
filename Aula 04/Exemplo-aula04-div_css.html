<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{
            background-color: rgb(104, 153, 137);
            border: 2px solid rgb(124, 243, 108);
            color: rgb(48, 41, 41);
        }
        #secundaria{
            background-color: blanchedalmond;
            border: 2px solid rgb(7, 9, 138);
            color: rgb(141, 80, 211);
        }
        hr{
            border: none;
            border-top: 3px solid rgb(68, 86, 189);
            width: 90%;
        }


    </style>

</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id="secundaria">
        Esta é outra divisão da pagina.
        <br>
        Aqui começa uma nova linha.

    </div>
</body>
</html>
